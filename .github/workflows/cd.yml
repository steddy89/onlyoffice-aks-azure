# ==============================================================================
# CD Pipeline - Deploy Infrastructure & Application
# ==============================================================================
name: CD - Deploy

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'kubernetes/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: 'Deployment action'
        required: true
        default: 'apply'
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

env:
  TERRAFORM_VERSION: "1.7.0"
  HELM_VERSION: "3.14.0"

jobs:
  # ---- Determine Environment ----
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      action: ${{ steps.env.outputs.action }}
    steps:
      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            echo "action=${{ github.event.inputs.action }}" >> $GITHUB_OUTPUT
          else
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "action=apply" >> $GITHUB_OUTPUT
          fi

  # ---- Deploy Infrastructure ----
  deploy-infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: [setup]
    environment: ${{ needs.setup.outputs.environment }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_SA }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=onlyoffice-aks-${{ needs.setup.outputs.environment }}.tfstate"

      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file=environments/${{ needs.setup.outputs.environment }}.tfvars \
            -out=tfplan

      - name: Terraform Apply
        if: needs.setup.outputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

      - name: Export Outputs
        if: needs.setup.outputs.action == 'apply'
        id: tf-outputs
        run: |
          echo "aks_name=$(terraform output -raw aks_cluster_name)" >> $GITHUB_OUTPUT
          echo "rg_name=$(terraform output -raw resource_group_name)" >> $GITHUB_OUTPUT
          echo "acr_login=$(terraform output -raw acr_login_server)" >> $GITHUB_OUTPUT

    outputs:
      aks_name: ${{ steps.tf-outputs.outputs.aks_name }}
      rg_name: ${{ steps.tf-outputs.outputs.rg_name }}
      acr_login: ${{ steps.tf-outputs.outputs.acr_login }}

  # ---- Deploy Application ----
  deploy-app:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: [setup, deploy-infra]
    if: needs.setup.outputs.action == 'apply'
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ needs.deploy-infra.outputs.rg_name }} \
            --name ${{ needs.deploy-infra.outputs.aks_name }} \
            --overwrite-existing

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: "v${{ env.HELM_VERSION }}"

      - name: Deploy ONLYOFFICE via Helm
        run: |
          helm upgrade --install onlyoffice-docserver \
            kubernetes/helm/onlyoffice-docserver \
            --namespace onlyoffice \
            --create-namespace \
            --values kubernetes/helm/onlyoffice-docserver/values.yaml \
            --wait \
            --timeout 10m \
            --atomic

      - name: Verify Deployment
        run: |
          echo "=== Deployment Status ==="
          kubectl get deployment -n onlyoffice
          echo ""
          echo "=== Pod Status ==="
          kubectl get pods -n onlyoffice
          echo ""
          echo "=== Service Status ==="
          kubectl get svc -n onlyoffice
          echo ""
          echo "=== Ingress Status ==="
          kubectl get ingress -n onlyoffice

      - name: Health Check
        run: |
          echo "Waiting for pods to be ready..."
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=onlyoffice-docserver \
            -n onlyoffice \
            --timeout=300s
          echo "All pods are ready!"

  # ---- Post-deployment Smoke Test ----
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [setup, deploy-app]
    if: needs.setup.outputs.action == 'apply'
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Health Check
        run: |
          MAX_RETRIES=10
          RETRY_INTERVAL=30
          
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i of $MAX_RETRIES..."
            HTTP_STATUS=$(curl -sk -o /dev/null -w "%{http_code}" \
              "https://${{ vars.ONLYOFFICE_DOMAIN }}/healthcheck" || echo "000")
            
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Health check passed!"
              exit 0
            fi
            
            echo "Got HTTP $HTTP_STATUS, retrying in ${RETRY_INTERVAL}s..."
            sleep $RETRY_INTERVAL
          done
          
          echo "Health check failed after $MAX_RETRIES attempts"
          exit 1

      - name: API Endpoint Test
        run: |
          RESPONSE=$(curl -sk "https://${{ vars.ONLYOFFICE_DOMAIN }}/web-apps/apps/api/documents/api.js")
          if echo "$RESPONSE" | grep -q "DocsAPI"; then
            echo "API endpoint is responding correctly"
          else
            echo "API endpoint check failed"
            exit 1
          fi

  # ---- Notification ----
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [setup, deploy-infra, deploy-app, smoke-test]
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ needs.setup.outputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Infrastructure | ${{ needs.deploy-infra.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Application | ${{ needs.deploy-app.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Test | ${{ needs.smoke-test.result }} |" >> $GITHUB_STEP_SUMMARY
