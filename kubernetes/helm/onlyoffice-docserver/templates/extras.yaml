{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "onlyoffice-docserver.fullname" . }}
  labels:
    {{- include "onlyoffice-docserver.labels" . | nindent 4 }}
spec:
  {{- if .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "onlyoffice-docserver.selectorLabels" . | nindent 6 }}
{{- end }}
---
{{- if .Values.priorityClassName }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.priorityClassName }}
value: 1000000
globalDefault: false
description: "High priority class for ONLYOFFICE Document Server"
{{- end }}
---
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "onlyoffice-docserver.serviceAccountName" . }}
  labels:
    {{- include "onlyoffice-docserver.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "onlyoffice-docserver.fullname" . }}
  labels:
    {{- include "onlyoffice-docserver.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "onlyoffice-docserver.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- with .Values.networkPolicy.ingress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    - {}  # Allow all egress (required for DB, Redis, storage)
{{- end }}
